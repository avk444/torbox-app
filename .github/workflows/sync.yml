name: Sync Upstream & Deploy to Hugging Face

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          cp Dockerfile /tmp/Dockerfile.custom
          cp start.sh /tmp/start.sh.custom

          git remote add upstream https://github.com/jittarao/torbox-app.git || true
          git fetch upstream main
          git merge upstream/main -X ours -m "Automated upstream sync" || true

          cp /tmp/Dockerfile.custom Dockerfile
          cp /tmp/start.sh.custom start.sh

          git add Dockerfile start.sh
          git commit -m "Restore custom deployment files" || true

      - name: Push Synced Repository
        run: |
          git push origin main || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build
        run: |
          bun install
          bun add lucide-react
          bun run build

      - name: Prepare Hugging Face Package
        run: |
          sed -i '/\.next/d' .gitignore || true

          rm -rf .next/cache
          rm -rf node_modules backend/node_modules
          find . -name "*.db*" -delete || true
          find . -name "*.sqlite*" -delete || true

          # Remove any files larger than 9 MB (HF rejects large blobs)
          find . -type f -size +9M -not -path "./.git/*" -print -delete

          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main
          git add .
          git commit -m "Deploy to Hugging Face"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Avk44:${HF_TOKEN}@huggingface.co/spaces/Avk44/torbox-manager main:main

