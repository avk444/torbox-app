name: Sync to Hugging Face Hub
on:
  push:
    branches: [automation-engine]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Engine
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Clean Slate Build
        run: |
          rm -rf .next node_modules backend/node_modules
          bun install
          bun run build

      - name: Surgical Purge of Offending Assets Only
        run: |
          # 1. Force Git to track the compiled production directory
          sed -i '/\.next/d' .gitignore || true

          # 2. Delete the hidden webpack compilation cache (>10MB files)
          rm -rf .next/cache

          # 3. Delete ONLY the specific oversized app icons Hugging Face rejected
          rm -f public/icons/icon-512x512.png
          rm -f src/app/android-chrome-512x512.png
          rm -f public/android-chrome-512x512.png 2>/dev/null || true

          # 4. Clean up local project workspace nodes before shipping
          rm -rf node_modules backend/node_modules

          # 5. Package the repository into a clean, flat transfer commit
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main
          git add .
          git commit -m "Surgical production build deployment"

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Avk44:$HF_TOKEN@huggingface.co/spaces/Avk44/torbox-manager main:main
