name: Sync to Hugging Face Hub
on:
  push:
    branches: [automation-engine]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Engine
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Heavy Compilation on GitHub Servers
        run: |
          bun install
          bun run build

      - name: Nuclear Purge of Binaries & Build Cache
        run: |
          # 1. Force the git tracker to include the compiled build folder
          sed -i '/\.next/d' .gitignore || true

          # 2. Drop the internal compiler cache completely (fixes the >10MB limit error)
          rm -rf .next/cache

          # 3. Delete ALL image assets causing Hugging Face's security push blocks
          find . -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.ico" -o -name "*.gif" -o -name "*.svg" \) -delete

          # 4. Clean local scratchpads before shipping
          rm -rf node_modules backend/node_modules

          # 5. Flat pack everything into a fresh commit state
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main
          git add .
          git commit -m "Pre-compiled package without cache assets"

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Avk44:$HF_TOKEN@huggingface.co/spaces/Avk44/torbox-manager main:main
